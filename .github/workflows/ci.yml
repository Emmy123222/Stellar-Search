name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Cache TypeScript intermediates
        id: typecheck-cache
        uses: actions/cache@v4
        with:
          path:
            node_modules/.cache
          key: ${ runner.os }-typecheck-$ { hashFiles('package-lock.json', 'tsconfig.json', 'tsconfig.node.json', 'tsconfig.server.json') }-$ { github.sha }
          restore-keys: |
            ${ { runner.os }-typecheck-${ { hashFiles('package-lock.json', 'tsconfig.json', 'tsconfig.node.json', 'tsconfig.server.json') }}-
            ${ { runner.os }-typecheck-

      - name: Log cache status
        run: echo "Typecheck cache hit: $ { steps.typecheck-cache.outputs.cache-hit || 'false' }"

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck (frontend, server, serveless, MCP, scripts)
        run: npm run typecheck:all

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Cache ESLint intermediates
        id: lint-cache
        uses: actions/cache@v4
        with:
          path:
            node_modules/.cache
            .eslintcache
          key: ${ { runner.os }-lint-$ { hashFiles('package-lock.json', 'eslint.config.js') }-$ { github.sha }
          restore-keys: |
            ${ { runner.os }-lint-${ { hashFiles('package-lock.json', 'eslint.config.js') }}-
            ${ { runner.os }-lint-

      - name: Log cache status
        run: echo "Lint cache hit: $ { steps.lint-cache.outputs.cache-hit || 'false' }"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint (enforces zero warnings baseline --max-warnings=0)
        run: npm run lint

  preflight:
    name: Preflight checks for wallet/search hooks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run preflight hook tests
        run: npx vitest run src/hooks/useSearch.test.ts src/hooks/useFreighterWallet.test.ts --reporter=verbose
        timeout-minutes: 5

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Cache Vite & Vitest intermediates
        id: test-cache
        uses: actions/cache@v4
        with:
          path:
            node_modules/.vite
            node_modules/.cache
          key: ${ { runner.os }-vitest-$ { hashFiles('package-lock.json', 'vite.config.ts', 'vitest.setup.ts', 'tsconfig.json', 'tsconfig.node.json', 'tsconfig.server.json') }-${ { github.sha }
          restore-keys: |
            ${ { runner.os }-vitest-${ { hashFiles('package-lock.json', 'vite.config.ts', 'vitest.setup.ts', 'tsconfig.json', 'tsconfig.node.json', 'tsconfig.server.json') }}-
            ${ { runner.os }-vitest-

      - name: Log cache status
        run: echo "Vitest cache hit: $ { steps.test-cache.outputs.cache-hit || 'false' }"

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest with coverage (enforces thresholds)
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Cache Vite & build intermediates
        id: build-cache
        uses: actions/cache@v4
        with:
          path:
            node_modules/.vite
            node_modules/.cache
          key: ${ { runner.os }-vite-build-${ { hashFiles('package-lock.json', 'vite.config.ts', 'tsconfig.json', 'tsconfig.node.json', 'tsconfig.server.json', 'tailwind.config.js', 'postcss.config.js') }-$ { github.sha }
          restore-keys: |
            ${ { runner.os }-vite-build-${ { hashFiles('package-lock.json', 'vite.config.ts', 'tsconfig.json', 'tsconfig.node.json', 'tsconfig.server.json', 'tailwind.config.js', 'postcss.config.js') }}-
            ${ { runner.os }-vite-build-

      - name: Log cache status
        run: echo "Build cache hit: $ { steps.build-cache.outputs.cache-hit || 'false' }"

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build

  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify coverage thresholds (statements, branches, functions, lines)
        run: npm run test:coverage -- --run
        # thresholds defined in vite.config.ts: global 25/23/20/26 + per-file ratchets for
        # src/lib/constants, src/lib/stellar, server/corsConfig, api/search, etc.
        # CI fails if any threshold drops — ratchet upward as payment/wallet/API/MCP/UI tests land.

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Upload production build for diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-build-${{ github.sha }}
          path: dist/
          if-no-files-found: warn
          retention-days: 7

  supply-chain:
    name: Supply chain (SBOM & vulnerabilities)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate CycloneDX SBOM
        run: npm run sbom

      - name: Verify SBOM artifact
        run: node scripts/verify-sbom.mjs

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: sbom.cyclonedx.json
          if-no-files-found: error

      - name: Install osv-scanner (pinned v1.9.2)
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL -o "$HOME/.local/bin/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v1.9.2/osv-scanner_linux_amd64"
          chmod +x "$HOME/.local/bin/osv-scanner"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Scan dependencies (OSV)
        run: |
          # osv-scanner exits 1 whenever it finds ANY unfiltered vulnerability,
          # including LOW/MODERATE ones that the policy explicitly allows. The
          # authoritative gate is scripts/check-vulnerabilities.mjs below, which
          # fails only on unexcused HIGH/CRITICAL findings — so tolerate the
          # scanner's exit code and always produce the JSON/SARIF artifacts.
          osv-scanner --recursive \
            --config=osv-scanner.toml \
            --format json \
            --output=osv-results.json ./ || true
          osv-scanner --recursive \
            --config=osv-scanner.toml \
            --format sarif \
            --output=osv-results.sarif ./ || true

      - name: Enforce dependency fail/exception policy (fail on unexcused HIGH/CRITICAL)
        run: node scripts/check-vulnerabilities.mjs osv-results.json
        # Policy: HIGH/CRITICAL findings not covered by a documented, time-boxed
        # exception in osv-scanner.toml fail the build. LOW/MODERATE are reported
        # only. See CONTRIBUTING.md > Supply-chain security.

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: osv-results.sarif
