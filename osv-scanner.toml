# OSV-Scanner configuration and dependency exception policy
#
# This file is the single source of truth for the project's dependency
# vulnerability exception policy. It is loaded in CI by the "supply-chain"
# job via:
#
#   osv-scanner --recursive --config=osv-scanner.toml --format json \
#               --output=osv-results.json ./
#
# `--config` makes this file apply to every lockfile scanned (instead of only
# the directory it lives in). That is why it sits at the repository root.
#
# ----------------------------------------------------------------------------
# FAIL / EXCEPTION POLICY (also documented in CONTRIBUTING.md)
# ----------------------------------------------------------------------------
# * CI FAILS whenever OSV-Scanner reports a HIGH or CRITICAL vulnerability that
#   is NOT covered by an explicit exception below (see scripts/check-vulnerabilities.mjs).
# * Every exception is time-limited: an `ignoreUntil` date is set so the finding
#   re-flags CI for triage once the deadline passes. The `reason` field must
#   explain the accepted risk and the planned remediation.
# * Any severities below High (Low/Moderate) are reported in the pipeline but
#   do NOT fail the build.
#
# To add a NEW exception, copy an [[IgnoredVulns]] block, set the `id` to the
# OSV/`GHSA-` identifier of the advisory, give a concrete `reason`, and choose
# the shortest `ignoreUntil` that is practical. Exceptions should be the
# exception, not the rule.

# ----------------------------------------------------------------------------
# Currently-excused HIGH/CRITICAL advisories (time-boxed)
# ----------------------------------------------------------------------------
# All entries below are known, pre-existing findings on the baseline dependency
# tree (as of the SBOM/dependency-gate milestone, Aug 2026). They are excused
# with a remediation deadline so the pipeline is green at this milestone, but
# the same gate will FAIL as these deadlines lapse until the underlying
# dependency is upgraded or replaced. New advisories for the same packages are
# NOT automatically excused and must be treated on their own merits.

# --- axios (runtime, transitive) ---
# Production-reachable HTTP client used by the @x402/x402 SDK. The applicable
# versions are pinned indirectly by the x402/@modelcontextprotocol stacks; no
# patched axios satisfies all constraints yet. Excused time-boxed pending an
# upstream-satisfying upgrade. Exploits require a malicious/attacker-controlled
# request target or proxy config that is not present in this server's usage.
