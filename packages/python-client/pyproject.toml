[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stellar-search-client"
version = "1.0.0"
description = "Typed Python client SDK for paid search with x402 on Stellar"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "StellarSearch Team" }
]
keywords = [
    "stellar",
    "x402",
    "search",
    "sdk",
    "client",
    "micropayments",
    "agent"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]
stellar = [
    "stellar-sdk>=9.0.0",
]

[project.urls]
Homepage = "https://github.com/Emmy123222/Stellar-Search"
Repository = "https://github.com/Emmy123222/Stellar-Search.git"

[tool.setuptools.packages.find]
where = ["."]
include = ["stellar_search*"]
